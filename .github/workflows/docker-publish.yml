name: Build & Publish Docker Images

# Triggers on every merge to main and on version tags.
# CI (ci.yml) gates quality; this workflow only publishes — it skips tests.
#
# Build-once, no-artifact design: the Maven reactor is built a single time and
# every service image is built + pushed from the local target/ dirs in the same
# job. We deliberately do NOT hand JARs between jobs via actions/upload-artifact:
# the bundled per-service target/libs trees are ~700 MB per run and, even at a
# 1-day retention, expired artifacts keep counting against the (small) storage
# quota until GitHub's 6–12h purge — which is what broke the deploy. No artifact
# upload == no artifact storage consumed.
on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Produces e.g. ghcr.io/red2n/shelf-j-gateway
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/shelf-j
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  # ── Build every service JAR once, then build & push all images (no artifacts) ─
  services:
    name: Build & publish service images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all modules
        run: mvn -B -V clean install -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push all service images
        run: |
          set -euo pipefail

          # Compute the tag suffixes once (mirrors docker/metadata-action):
          #   - sha-<short>           always
          #   - <version>/<maj.min>/<maj>   on v*.*.* tag pushes
          #   - <branch> + latest     on default-branch pushes / dispatch
          suffixes=("sha-$(echo "${GITHUB_SHA}" | cut -c1-7)")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            suffixes+=("$version" "${version%.*}" "${version%%.*}")
          else
            suffixes+=("${GITHUB_REF_NAME}")
            if [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
              suffixes+=("latest")
            fi
          fi

          # name|svc_path|svc_jar  — must stay in sync with the service catalog.
          services=(
            # Platform
            "gateway|platform/gateway|gateway"
            "config|platform/config|config-svc"
            # Business — Phase 1 (back-office)
            "iam-svc|services/iam-svc|iam-svc"
            "tenant-svc|services/tenant-svc|tenant-svc"
            "product-svc|services/product-svc|product-svc"
            "inventory-svc|services/inventory-svc|inventory-svc"
            "purchase-svc|services/purchase-svc|purchase-svc"
            # Business — Phase 2 (commerce)
            "pricing-svc|services/pricing-svc|pricing-svc"
            "cart-svc|services/cart-svc|cart-svc"
            "order-svc|services/order-svc|order-svc"
            "payment-svc|services/payment-svc|payment-svc"
            # Business — Phase 3 (experience)
            "customer-svc|services/customer-svc|customer-svc"
            "notification-svc|services/notification-svc|notification-svc"
            "reporting-svc|services/reporting-svc|reporting-svc"
          )

          {
            echo "## Published images"
            echo ""
            echo "| Service | Image |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for entry in "${services[@]}"; do
            IFS='|' read -r name svc_path svc_jar <<< "$entry"
            image="${IMAGE_PREFIX}-${name}"
            tag_args=()
            for s in "${suffixes[@]}"; do
              tag_args+=("-t" "${image}:${s}")
            done
            echo "::group::Building ${image}"
            # --provenance/--sbom=false: skip the attestation manifests buildx
            # otherwise attaches on push — they show up as extra untagged GHCR
            # versions and just add storage with no value for our single-arch JVM image.
            docker buildx build \
              --push \
              --provenance=false \
              --sbom=false \
              --file Dockerfile.svc \
              --build-arg "SVC_PATH=${svc_path}" \
              --build-arg "SVC_JAR=${svc_jar}" \
              "${tag_args[@]}" \
              .
            echo "::endgroup::"
            echo "| ${name} | \`${image}:latest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

  # ── Build the Flutter web bundle and push its image (no artifacts) ─────────
  # Set SHELFJ_API_BASE as a GitHub Actions repository variable (Settings →
  # Variables → Actions) to the production gateway URL, e.g.
  # https://api.example.com/api. Defaults to /api (relative — works when the
  # gateway and web app share a host or nginx proxies /api upstream).
  web:
    name: Build & publish web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must match the Flutter SDK devs build against locally: flutter_localizations
          # pins an exact intl version per-SDK, and pubspec.yaml's intl constraint is set
          # for the dev-machine SDK. A CI/dev version mismatch makes `pub get` unsolvable
          # (two different exact intl pins) — bump this together with local Flutter upgrades.
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontends/shelf-app
        run: flutter pub get

      - name: Flutter build web
        working-directory: frontends/shelf-app
        env:
          SHELFJ_API_BASE: ${{ vars.SHELFJ_API_BASE || '/api' }}
        run: |
          flutter build web --release \
            --dart-define=SHELFJ_API_BASE=$SHELFJ_API_BASE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Prune old GHCR versions: keep current + previous build per package ──────
  # A push never deletes the old image — it only moves the latest/main tags, so
  # every prior version lingers (still carrying its unique sha-<commit> tag) and
  # accumulates forever. This job keeps the 2 newest versions per package (so you
  # can still roll back one build) and deletes everything older, plus any
  # untagged leftovers. Runs only on default-branch / tag publishes, never on a
  # workflow_dispatch from a feature branch.
  cleanup:
    name: Prune old GHCR versions
    needs: [services, web]
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - shelf-j-gateway
          - shelf-j-config
          - shelf-j-iam-svc
          - shelf-j-tenant-svc
          - shelf-j-product-svc
          - shelf-j-inventory-svc
          - shelf-j-purchase-svc
          - shelf-j-pricing-svc
          - shelf-j-cart-svc
          - shelf-j-order-svc
          - shelf-j-payment-svc
          - shelf-j-customer-svc
          - shelf-j-notification-svc
          - shelf-j-reporting-svc
          - shelf-j-web

    steps:
      - name: Keep last 2 versions of ${{ matrix.package }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ matrix.package }}
          # Keep the 2 most recent tagged versions (current + previous build).
          keep-n-tagged: 2
          # Remove dangling/untagged manifests left behind by older pushes.
          delete-untagged: true
          # Don't fail the run if a package doesn't exist yet (first publish).
          validate: true
