# Shelf-J — local development stack (production-grade configuration).
#
# Brings up infrastructure with HEALTHCHECKS, then platform + business services
# gated on those healthchecks — modelling production readiness-gated startup.
#
# All services share `shelfj_network`; inter-container addressing is by service
# name on port 8080 (e.g. http://iam-svc:8080).  The only host-published app
# port is the gateway on 8090.
#
# Usage:
#   mvn clean install -DskipTests              # build all JARs first (JDK 21)
#   docker compose up -d --build               # build images + start everything
#
# Port map (host → container):
#   5432  postgres         5433  pgbouncer       6379  redis
#   8500  consul           9092  kafka           8081  kafka-ui
#   9411  zipkin           4317  otel-collector  4318  otel-collector (HTTP)
#   9090  prometheus       3100  grafana         5555  pgadmin
#   8888  config           8090  gateway (public entry point)

name: shelf-j

networks:
  shelfj_network:
    name: shelfj_network
    driver: bridge

# ── Named volumes (all stateful services get persistent storage) ─────────────
volumes:
  pgdata:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:

services:
  # ---------------------------------------------------------------- infrastructure

  # PostgreSQL tuned for multi-tenant workload.
  # Defaults sized for a 4–8 GB dev host; override via .env (PG_SHARED_BUFFERS, etc.).
  # For production K8s, pass these as initContainer args — don't bake them in the image.
  postgres:
    image: postgres:16-alpine
    container_name: shelfj-postgres
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - wal_buffers=${PG_WAL_BUFFERS:-16MB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-128MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-off}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-300}
      - -c
      - autovacuum_max_workers=${PG_AUTOVACUUM_MAX_WORKERS:-3}
      - -c
      - autovacuum_vacuum_scale_factor=${PG_AUTOVACUUM_VACUUM_SCALE:-0.05}
      - -c
      - autovacuum_analyze_scale_factor=${PG_AUTOVACUUM_ANALYZE_SCALE:-0.025}
      - -c
      - autovacuum_vacuum_cost_delay=${PG_AUTOVACUUM_COST_DELAY:-2ms}
      - -c
      - default_statistics_target=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION:-200}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelfj}
      POSTGRES_USER: ${POSTGRES_USER:-shelfj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelfj_dev_change_me}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shelfj}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # PgBouncer — connection pooler (transaction mode, 2000 app → 150 real connections).
  # Business services connect to postgres:5432 directly so that embedded Flyway DDL
  # transactions work without transaction-mode restrictions. Switch app pools to
  # pgbouncer:5433 once Flyway is separated from the application lifecycle (e.g. k8s Job).
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: shelfj-pgbouncer
    restart: always
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_USER: ${POSTGRES_USER:-shelfj}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-shelfj_dev_change_me}
      DATABASES_DBNAME: ${POSTGRES_DB:-shelfj}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "2000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "50"
      PGBOUNCER_MIN_POOL_SIZE: "10"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_MAX_DB_CONNECTIONS: "150"
      PGBOUNCER_SERVER_LIFETIME: "3600"
      PGBOUNCER_SERVER_IDLE_TIMEOUT: "300"
      PGBOUNCER_QUERY_TIMEOUT: "30"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: "extra_float_digits,options"
      PGBOUNCER_AUTH_TYPE: trust
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
    volumes:
      - ./infra/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["5433:6432"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:latest
    container_name: shelfj-consul
    restart: always
    command: agent -dev -client=0.0.0.0
    ports: ["8500:8500"]
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Kafka in KRaft mode (no Zookeeper — Kafka 3.6+).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shelfj-kafka
    restart: always
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 0WL1kI1NQdi0DVeRDFPA4g
      # JVM heap — override with KAFKA_HEAP_OPTS in .env for larger machines.
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms512m -Xmx1g}"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ExplicitGCInvokesConcurrent"
    volumes: ["kafka_data:/var/lib/kafka/data"]
    networks: [shelfj_network]
    deploy:
      resources:
        limits:
          memory: "${KAFKA_MEM_LIMIT:-1300m}"
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  # Kafka UI — browse topics, consumer groups, and messages.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: shelfj-kafka-ui
    restart: unless-stopped
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: shelfj-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "${KAFKA_UI_JAVA_OPTS:--Xms128m -Xmx384m}"
    deploy:
      resources:
        limits:
          memory: "${KAFKA_UI_MEM_LIMIT:-550m}"
        reservations:
          memory: 128m
    depends_on:
      kafka: { condition: service_healthy }
    networks: [shelfj_network]

  redis:
    image: redis:7-alpine
    container_name: shelfj-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_change_me}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: shelfj-zipkin
    restart: unless-stopped
    ports: ["9411:9411"]
    environment:
      JAVA_OPTS: "${ZIPKIN_JAVA_OPTS:--Xms128m -Xmx512m}"
    deploy:
      resources:
        limits:
          memory: "${ZIPKIN_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # OTEL Collector — receives OTLP (gRPC 4317 / HTTP 4318), exports to Zipkin.
  # Current services send traces directly to Zipkin via the Zipkin exporter.
  # Migrate services to OTLP by setting:
  #   otel.traces.exporter=otlp
  #   otel.exporter.otlp.endpoint=http://otel-collector:4317
  # and replacing opentelemetry-exporter-zipkin with opentelemetry-exporter-otlp in POMs.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: shelfj-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      zipkin: { condition: service_healthy }
    networks: [shelfj_network]

  # node_exporter — host CPU, memory, disk, network metrics.
  # rootfs bind-mount omitted: WSL2 root is not a shared/slave mount.
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: shelfj-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports: ["9100:9100"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # postgres_exporter — PostgreSQL connections, query stats, table/index health
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: shelfj-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-shelfj}:${POSTGRES_PASSWORD:-shelfj_dev_change_me}@postgres:5432/${POSTGRES_DB:-shelfj}?sslmode=disable"
    ports: ["9187:9187"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # redis_exporter — Redis memory, ops/sec, keyspace, evictions.
  # Distroless image (no shell) — healthcheck not applicable.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: shelfj-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_change_me}
    ports: ["9121:9121"]
    depends_on:
      redis: { condition: service_healthy }
    networks: [shelfj_network]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: shelfj-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    deploy:
      resources:
        limits:
          memory: "${PROMETHEUS_MEM_LIMIT:-512m}"
        reservations:
          memory: 64m
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: shelfj-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_dev_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3100:3000"]   # 3100 avoids conflicts with local dev servers on 3000
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin — Postgres GUI. http://localhost:5555 (override with PGADMIN_PORT).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shelfj-pgadmin
    restart: unless-stopped
    ports: ["${PGADMIN_PORT:-5555}:80"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@shelfj.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev_change_me}
    volumes: ["pgadmin_data:/var/lib/pgadmin"]
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- platform services

  config:
    image: ghcr.io/red2n/shelf-j-config:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: platform/config, SVC_JAR: config-svc }
    container_name: shelfj-config
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${CONFIG_JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
    deploy:
      resources:
        limits:
          memory: "${CONFIG_MEM_LIMIT:-384m}"
        reservations:
          memory: 64m
    ports: ["8888:8080"]
    networks: [shelfj_network]
    depends_on:
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------- business services

  iam-svc:
    image: ghcr.io/red2n/shelf-j-iam-svc:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/iam-svc, SVC_JAR: iam-svc }
    container_name: shelfj-iam
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${IAM_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      shelfj.db.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shelfj}
      shelfj.db.user: ${POSTGRES_USER:-shelfj}
      shelfj.db.password: ${POSTGRES_PASSWORD:-shelfj_dev_change_me}
      shelfj.consul.host: consul
      shelfj.consul.port: "8500"
      shelfj.kafka.bootstrap: kafka:29092
      SHELFJ_ADVERTISE_HOST: iam-svc
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${IAM_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [shelfj_network]
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      consul:   { condition: service_healthy }
      config:   { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  tenant-svc:
    image: ghcr.io/red2n/shelf-j-tenant-svc:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/tenant-svc, SVC_JAR: tenant-svc }
    container_name: shelfj-tenant
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${TENANT_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      shelfj.db.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shelfj}
      shelfj.db.user: ${POSTGRES_USER:-shelfj}
      shelfj.db.password: ${POSTGRES_PASSWORD:-shelfj_dev_change_me}
      shelfj.consul.host: consul
      shelfj.consul.port: "8500"
      shelfj.kafka.bootstrap: kafka:29092
      SHELFJ_ADVERTISE_HOST: tenant-svc
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${TENANT_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [shelfj_network]
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      consul:   { condition: service_healthy }
      config:   { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  inventory-svc:
    image: ghcr.io/red2n/shelf-j-inventory-svc:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/inventory-svc, SVC_JAR: inventory-svc }
    container_name: shelfj-inventory
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${INVENTORY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      shelfj.db.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shelfj}
      shelfj.db.user: ${POSTGRES_USER:-shelfj}
      shelfj.db.password: ${POSTGRES_PASSWORD:-shelfj_dev_change_me}
      shelfj.consul.host: consul
      shelfj.consul.port: "8500"
      shelfj.kafka.bootstrap: kafka:29092
      SHELFJ_ADVERTISE_HOST: inventory-svc
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${INVENTORY_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [shelfj_network]
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      consul:   { condition: service_healthy }
      config:   { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  product-svc:
    image: ghcr.io/red2n/shelf-j-product-svc:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/product-svc, SVC_JAR: product-svc }
    container_name: shelfj-product
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${PRODUCT_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      shelfj.db.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shelfj}
      shelfj.db.user: ${POSTGRES_USER:-shelfj}
      shelfj.db.password: ${POSTGRES_PASSWORD:-shelfj_dev_change_me}
      shelfj.consul.host: consul
      shelfj.consul.port: "8500"
      shelfj.kafka.bootstrap: kafka:29092
      SHELFJ_ADVERTISE_HOST: product-svc
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${PRODUCT_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [shelfj_network]
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      consul:   { condition: service_healthy }
      config:   { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------- gateway (single public door)

  gateway:
    image: ghcr.io/red2n/shelf-j-gateway:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: platform/gateway, SVC_JAR: gateway }
    container_name: shelfj-gateway
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${GATEWAY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      shelfj.consul.host: consul
      shelfj.consul.port: "8500"
      shelfj.gateway.rate-limit.requests-per-minute: "10000"
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${GATEWAY_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    ports: ["${GATEWAY_HOST_PORT:-8090}:8080"]   # the ONLY app port published to the host
    networks: [shelfj_network]
    depends_on:
      consul:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
