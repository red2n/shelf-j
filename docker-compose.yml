  # ---------------------------------------------------------------- gateway (single public door)

  # Gateway waits for iam-svc and tenant-svc: these are the services clients hit first.
  # All others register with Consul and are discoverable once healthy.
  gateway:
    image: ghcr.io/red2n/shelf-j-gateway:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: platform/gateway, SVC_JAR: gateway }
    container_name: shelfj-gateway
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${GATEWAY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      shelfj.consul.host: consul
      shelfj.consul.port: "8500"
      # Per-IP budget. The k6 regression suite drives ~50 VUs from one host IP and peaks
      # well above 10k/min; 10k caused mid-run 429 cascades. Local-dev/load-test value only.
      shelfj.gateway.rate-limit.requests-per-minute: "30000"
      shelfj.jwt.secret: ${SHELFJ_JWT_SECRET:?SHELFJ_JWT_SECRET must be set (>= 32 chars) - see .env.example}
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
      shelfj.gateway.cors.allowed-origins: "*"
      # Bulk admin operations (e.g. CSV catalog import) process thousands of rows
      # synchronously upstream; the 10s code default is tuned for normal request/response
      # calls and times out well before a large import finishes server-side.
      shelfj.gateway.upstream.read-timeout-seconds: "${GATEWAY_UPSTREAM_READ_TIMEOUT_SECONDS:-120}"
      # Rate-limit / brute-force counters live here, shared across every gateway replica.
      shelfj.redis.host: redis
      shelfj.redis.port: "6379"
      shelfj.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
    mem_limit: ${GATEWAY_MEM_LIMIT:-700m}
    ports: ["${GATEWAY_HOST_PORT:-8090}:8080"]
    networks: [shelfj_network]
    depends_on:
      consul:     { condition: service_healthy }
      iam-svc:    { condition: service_healthy }
      tenant-svc: { condition: service_healthy }
      redis:      { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: seeds the PLATFORM_ADMIN on a fresh DB. Safe to re-run — the bootstrap
  # endpoint returns 409 if an admin already exists, which we treat as success.
  bootstrap:
    image: curlimages/curl:8.7.1
    container_name: shelfj-bootstrap
    restart: "no"
    networks: [shelfj_network]
    depends_on:
      gateway: { condition: service_healthy }
    environment:
      ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@shelf-j.dev}
      ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD must be set - see .env.example}
    command:
      - sh
      - -c
      - |
        STATUS=$$(curl -s -o /dev/null -w '%{http_code}' -X POST http://gateway:8080/api/iam-svc/bootstrap/admin -H 'Content-Type: application/json' -d "{\"email\":\"$$ADMIN_EMAIL\",\"password\":\"$$ADMIN_PASSWORD\"}");
        if [ "$$STATUS" = "201" ]; then echo "[bootstrap] Platform admin created ($$ADMIN_EMAIL)";
        elif [ "$$STATUS" = "409" ]; then echo "[bootstrap] Platform admin already exists — skipped";
        else echo "[bootstrap] Unexpected status $$STATUS"; exit 1; fi

  # ---------------------------------------------------------------- web UI (Flutter)

  # Single-page app (admin console + storefront + in-store POS), served by a
  # non-root nginx. The browser calls the gateway directly at the host URL baked
  # in at build time (SHELFJ_API_BASE, default http://localhost:8090/api), so the
  # UI container itself never needs to reach the gateway over the compose network.
  shelf-app:
    image: ghcr.io/red2n/shelf-j-web:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: shelfj-web
    restart: unless-stopped
    # Default 8088 to avoid clashing with the dev `flutter run` server (40015).
    ports: ["${UI_HOST_PORT:-8088}:8080"]
    networks: [shelfj_network]
    depends_on:
      gateway: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s
