# Shelf-J — local development stack.
#
# Startup is health-check driven: each layer waits for the previous to be ready.
# Infra → Platform (config/consul) → Business services (parallel) → Gateway
#
# All services share `shelfj_network`; inter-container addressing is by service
# name on port 8080 (e.g. http://iam-svc:8080).
#
# Usage:
#   cp .env.example .env && nano .env   # set real secrets
#   mvn clean install -DskipTests       # build all JARs (JDK 21)
#   docker compose up -d --build        # build images + start everything
#
# Ports exposed to the host (developers need these):
#   8088  shelf-app (web UI: admin/storefront/POS)
#   8090  gateway (public entry point)    3100  grafana
#   5555  pgadmin                         8500  consul UI
#   8081  kafka-ui                        9411  zipkin
#   5432  postgres (direct SQL access)    6379  redis (redis-cli)
#   9090  prometheus
#
# Ports intentionally NOT exposed (internal only — use Grafana for observability):
#   otel-collector (4317/4318), loki (3100), tempo (3200), node/postgres/redis
#   exporters (9100/9187/9121), pgbouncer (6432), config-svc (8080)

name: shelf-j

networks:
  shelfj_network:
    name: shelfj_network
    driver: bridge

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  pgdata:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  pgadmin_data:
  loki_data:
  tempo_data:

# ── YAML anchors — shared blocks to avoid repeating 8 env vars per service ──
x-svc-env: &svc-env
  server.port: "8080"
  # Runtime app pool goes through PgBouncer (golden rule: don't orphan provisioned infra).
  # Flyway gets its own direct-to-Postgres URL below — its DDL migrations run as multi-statement
  # transactions that need full session affinity, which PgBouncer's transaction pool_mode breaks.
  shelfj.db.url: jdbc:postgresql://pgbouncer:6432/${POSTGRES_DB:-shelfj}
  shelfj.db.migration-url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shelfj}
  shelfj.db.user: ${POSTGRES_USER:-shelfj}
  shelfj.db.password: ${POSTGRES_PASSWORD:-shelfj_dev_change_me}
  shelfj.consul.host: consul
  shelfj.consul.port: "8500"
  shelfj.kafka.bootstrap: kafka:29092
  otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans

x-svc-depends: &svc-depends
  postgres:  { condition: service_healthy }
  pgbouncer: { condition: service_healthy }
  kafka:     { condition: service_healthy }
  consul:    { condition: service_healthy }
  config:    { condition: service_healthy }

x-svc-healthcheck: &svc-healthcheck
# eclipse-temurin:21-jre ships curl but not wget.
  test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/health/live || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  # ---------------------------------------------------------------- infrastructure

  # PostgreSQL tuned for multi-tenant workload.
  # Defaults sized for a 4–8 GB dev host; override via .env (PG_SHARED_BUFFERS, etc.).
  postgres:
    image: postgres:16-alpine
    container_name: shelfj-postgres
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - wal_buffers=${PG_WAL_BUFFERS:-16MB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-128MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-off}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-300}
      - -c
      - autovacuum_max_workers=${PG_AUTOVACUUM_MAX_WORKERS:-3}
      - -c
      - autovacuum_vacuum_scale_factor=${PG_AUTOVACUUM_VACUUM_SCALE:-0.05}
      - -c
      - autovacuum_analyze_scale_factor=${PG_AUTOVACUUM_ANALYZE_SCALE:-0.025}
      - -c
      - autovacuum_vacuum_cost_delay=${PG_AUTOVACUUM_COST_DELAY:-2ms}
      - -c
      - default_statistics_target=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION:-200}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelfj}
      POSTGRES_USER: ${POSTGRES_USER:-shelfj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelfj_dev_change_me}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Per-service roles + GRANTs (golden rule #1 hardening). Only runs on a fresh
      # volume; against an existing one, re-apply manually — see header comment in
      # the script for the exact `docker compose exec` invocation.
      - ./infra/postgres-init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shelfj}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # PgBouncer — connection pooler (transaction mode, 2000 app → 150 real connections).
  # Business services route their runtime pool through pgbouncer:6432 (shelfj.db.url, set in
  # x-svc-env above). Flyway uses its own shelfj.db.migration-url straight to postgres:5432 —
  # its DDL migrations are multi-statement transactions that need full session affinity, which
  # this pooler's transaction pool_mode does not guarantee mid-migration.
  # NOTE: auth_type=trust is fine for local dev (no external access). Change to
  # scram-sha-256 for any shared or internet-facing deployment.
  pgbouncer:
    # pgbouncer/pgbouncer does not publish consistent versioned tags beyond 1.15.0;
    # latest is the only way to get a current release from this image.
    image: pgbouncer/pgbouncer:latest
    container_name: shelfj-pgbouncer
    restart: always
    environment:
      # Raw DATABASES entry with no fixed user/password: each connecting service
      # authenticates as its own per-service role (infra/postgres-init-roles.sql), and
      # that same identity is what PgBouncer uses against the real Postgres backend —
      # via the credential stored for it in userlist.txt. A fixed DATABASES_USER would
      # collapse every connection back to one shared identity and defeat the
      # per-service GRANTs.
      DATABASES: "* = host=postgres port=5432 dbname=${POSTGRES_DB:-shelfj}"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "2000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "50"
      PGBOUNCER_MIN_POOL_SIZE: "10"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_MAX_DB_CONNECTIONS: "150"
      PGBOUNCER_SERVER_LIFETIME: "3600"
      PGBOUNCER_SERVER_IDLE_TIMEOUT: "300"
      PGBOUNCER_QUERY_TIMEOUT: "30"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: "extra_float_digits,options"
      PGBOUNCER_AUTH_TYPE: trust
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
    # infra/pgbouncer-userlist.txt holds one "username" "password" line per role
    # (bootstrap + all 12 per-service roles), kept in sync by hand with
    # infra/postgres-init-roles.sql and the <SERVICE>_DB_PASSWORD vars above/below.
    # IMPORTANT: this pgbouncer build's userlist.txt parser rejects ANY "#" comment
    # line outright (logs "ERROR broken auth file" and silently drops every user) —
    # do not add comments to that file; put notes here instead.
    volumes:
      - ./infra/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:1.22.0
    container_name: shelfj-consul
    restart: always
    command: agent -dev -client=0.0.0.0
    ports: ["127.0.0.1:8500:8500"]
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Kafka in KRaft mode (no Zookeeper — Kafka 3.6+).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: shelfj-kafka
    restart: always
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 0WL1kI1NQdi0DVeRDFPA4g
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms512m -Xmx1g}"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ExplicitGCInvokesConcurrent"
    volumes: ["kafka_data:/var/lib/kafka/data"]
    mem_limit: ${KAFKA_MEM_LIMIT:-1300m}
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  # Kafka UI — browse topics, consumer groups, and messages.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: shelfj-kafka-ui
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: shelfj-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "${KAFKA_UI_JAVA_OPTS:--Xms128m -Xmx384m}"
    mem_limit: ${KAFKA_UI_MEM_LIMIT:-550m}
    depends_on:
      kafka: { condition: service_healthy }
    networks: [shelfj_network]

  redis:
    image: redis:7-alpine
    container_name: shelfj-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_change_me}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: shelfj-zipkin
    restart: unless-stopped
    ports: ["127.0.0.1:9411:9411"]
    environment:
      JAVA_OPTS: "${ZIPKIN_JAVA_OPTS:--Xms128m -Xmx512m}"
    mem_limit: ${ZIPKIN_MEM_LIMIT:-700m}
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # OTEL Collector — receives OTLP traces+logs; exports traces → Tempo+Zipkin, logs → Loki.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: shelfj-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      zipkin: { condition: service_healthy }
      loki:   { condition: service_healthy }
      tempo:  { condition: service_healthy }
    networks: [shelfj_network]

  # node_exporter — host CPU, memory, disk, network metrics (internal only).
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: shelfj-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # postgres_exporter — internal; scraped by Prometheus.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: shelfj-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-shelfj}:${POSTGRES_PASSWORD:-shelfj_dev_change_me}@postgres:5432/${POSTGRES_DB:-shelfj}?sslmode=disable"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # redis_exporter — internal; scraped by Prometheus.
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: shelfj-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_change_me}
    depends_on:
      redis: { condition: service_healthy }
    networks: [shelfj_network]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: shelfj-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: shelfj-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_dev_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["127.0.0.1:3100:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
      loki:       { condition: service_healthy }
      tempo:      { condition: service_healthy }
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin — http://localhost:5555
  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: shelfj-pgadmin
    restart: unless-stopped
    ports: ["127.0.0.1:${PGADMIN_PORT:-5555}:80"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@shelfj.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev_change_me}
    volumes: ["pgadmin_data:/var/lib/pgadmin"]
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- observability: logs + traces

  # Loki — log aggregation backend (internal; access via Grafana Explore).
  loki:
    image: grafana/loki:3.1.0
    container_name: shelfj-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    mem_limit: ${LOKI_MEM_LIMIT:-512m}
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Promtail — scrapes Docker container logs and ships to Loki.
  promtail:
    image: grafana/promtail:3.1.0
    container_name: shelfj-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infra/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    mem_limit: ${PROMTAIL_MEM_LIMIT:-256m}
    networks: [shelfj_network]
    depends_on:
      loki: { condition: service_healthy }

  # Tempo — distributed tracing backend (internal; access via Grafana Explore).
  tempo:
    image: grafana/tempo:2.5.0
    container_name: shelfj-tempo
    restart: unless-stopped
    user: root
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./infra/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    mem_limit: ${TEMPO_MEM_LIMIT:-512m}
    networks: [shelfj_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------- platform services

  config:
    image: ghcr.io/red2n/shelf-j-config:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: platform/config, SVC_JAR: config-svc }
    container_name: shelfj-config
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${CONFIG_JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
      SHELFJ_CONFIG_TOKEN: ${SHELFJ_CONFIG_TOKEN:?SHELFJ_CONFIG_TOKEN must be set (>= 32 chars) - see .env.example}
    mem_limit: ${CONFIG_MEM_LIMIT:-384m}
    networks: [shelfj_network]
    depends_on:
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------------------------------------------------------------- business services

  iam-svc:
    image: ghcr.io/red2n/shelf-j-iam-svc:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/iam-svc, SVC_JAR: iam-svc }
    container_name: shelfj-iam
    restart: unless-stopped
    environment:
      <<: *svc-env
      shelfj.db.user: iam_svc
      shelfj.db.password: ${IAM_DB_PASSWORD:-iam_dev_change_me}
      JAVA_TOOL_OPTIONS: "${IAM_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      SHELFJ_ADVERTISE_HOST: iam-svc
      shelfj.jwt.secret: ${SHELFJ_JWT_SECRET:?SHELFJ_JWT_SECRET must be set (>= 32 chars) - see .env.example}
    mem_limit: ${IAM_MEM_LIMIT:-700m}
    networks: [shelfj_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  tenant-svc:
    image: ghcr.io/red2n/shelf-j-tenant-svc:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/tenant-svc, SVC_JAR: tenant-svc }
    container_name: shelfj-tenant
    restart: unless-stopped
    environment:
      <<: *svc-env
      shelfj.db.user: tenant_svc
      shelfj.db.password: ${TENANT_DB_PASSWORD:-tenant_dev_change_me}
      JAVA_TOOL_OPTIONS: "${TENANT_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      SHELFJ_ADVERTISE_HOST: tenant-svc
    mem_limit: ${TENANT_MEM_LIMIT:-700m}
    networks: [shelfj_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  inventory-svc:
    image: ghcr.io/red2n/shelf-j-inventory-svc:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/inventory-svc, SVC_JAR: inventory-svc }
    container_name: shelfj-inventory
    restart: unless-stopped
    environment:
      <<: *svc-env
      shelfj.db.user: inventory_svc
      shelfj.db.password: ${INVENTORY_DB_PASSWORD:-inventory_dev_change_me}
      JAVA_TOOL_OPTIONS: "${INVENTORY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      SHELFJ_ADVERTISE_HOST: inventory-svc
    mem_limit: ${INVENTORY_MEM_LIMIT:-700m}
    networks: [shelfj_network]
    depends_on: *svc-depends
    healthcheck: *svc-healthcheck

  order-svc:
    image: ghcr.io/red2n/shelf-j-order-svc:${SHELFJ_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/order-svc, SVC_JAR: order-svc }
    container_name: shelfj-order
    restart: unless-stopped
    environment:
      <<: *svc-env
      shelfj.db.user: order_svc
      shelfj.db.password: ${ORDER_DB_PASSWORD:-order_dev_change_me}
