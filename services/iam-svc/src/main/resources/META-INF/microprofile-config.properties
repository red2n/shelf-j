# iam-svc — defaults (local dev). Secrets come from env / config service in real deployments.
shelfj.service.name=iam-svc
server.port=8001
server.host=0.0.0.0

# OpenAPI: generated paths are service-relative (e.g. /auth/login), but the only reachable
# address is through the gateway proxy at /api/iam-svc/.... A relative server URL resolves
# against wherever the spec itself was fetched from (the gateway), so Swagger UI's "Try it
# out" builds the correct request instead of failing with no scheme/host.
mp.openapi.servers=/api/iam-svc

# Database
shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=iam_svc
shelfj.db.password=iam_dev_change_me

# Consul
shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

# Kafka (outbox publisher). Set enabled=false to run without Kafka.
shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
shelfj.outbox.poll-seconds=5

# Tokens (20.15): RS256 under a rotating key. iam-svc makes its own key pair, keeps the private
# half sealed in its database and publishes the public half at /auth/.well-known/jwks.json, which
# is all the gateway and the MQTT broker verify against. A key signs for rotation-days; on
# rotation the old key stays published for retire-after-seconds (at least the access token
# lifetime) so tokens already out keep verifying, then its private half is wiped.
# shelfj.jwt.secret is intentionally NOT set here: it seals the private halves at rest and must
# come from the environment (docker-compose / .env locally, a secret store in production). The
# service refuses to start without one of >= 32 characters.
shelfj.jwt.rotation-days=90
# A rotated key is published this long before it signs anything, so verifiers that re-read the
# key set on a schedule (the MQTT broker: every 30 s) have it before a token names it.
shelfj.jwt.publish-lead-seconds=60
shelfj.jwt.retire-after-seconds=3600
shelfj.jwt.issuer=shelfj
shelfj.jwt.access-ttl-seconds=900
shelfj.jwt.refresh-ttl-seconds=1209600

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=iam-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0
