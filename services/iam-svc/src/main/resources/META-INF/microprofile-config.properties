# iam-svc — defaults (local dev). Secrets come from env / config service in real deployments.
shelfj.service.name=iam-svc
server.port=8001
server.host=0.0.0.0

# OpenAPI: generated paths are service-relative (e.g. /auth/login), but the only reachable
# address is through the gateway proxy at /api/iam-svc/.... A relative server URL resolves
# against wherever the spec itself was fetched from (the gateway), so Swagger UI's "Try it
# out" builds the correct request instead of failing with no scheme/host.
mp.openapi.servers=/api/iam-svc

# Database
shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=iam_svc
shelfj.db.password=iam_dev_change_me

# Consul
shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

# Kafka (outbox publisher). Set enabled=false to run without Kafka.
shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
shelfj.outbox.poll-seconds=5

# JWT — HS256. shelfj.jwt.secret is intentionally NOT set here: it must come from the
# environment (docker-compose / .env locally, a secret store in production). The service
# refuses to start without one of >= 32 characters.
# PRODUCTION: RS256 keypair from a secret store.
shelfj.jwt.issuer=shelfj
shelfj.jwt.access-ttl-seconds=900
shelfj.jwt.refresh-ttl-seconds=1209600

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=iam-svc
otel.traces.exporter=zipkin
otel.exporter.zipkin.endpoint=http://localhost:9411/api/v2/spans
