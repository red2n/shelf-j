openapi: 3.0.3
info:
  title: Reporting Service API
  version: "1.0"
  description: >
    Pure CQRS read-model service built by consuming inventory and sales events (StockReceived,
    StockDeducted, StockAdjusted, TransferOrderShipped/Received, OrderConfirmed, PaymentRefunded).
    Serves cross-store inventory reports (on-hand, supply/demand netting, movement statistics) and
    sales revenue reports (summary, daily buckets). Publishes no events of its own. Reached through
    the API gateway at /api/reporting-svc.
tags:
  - name: Inventory Reports
    description: Cross-store on-hand, supply/demand netting, and movement-statistics reports.
  - name: Sales Reports
    description: Revenue summary and daily revenue-bucket reports, net of refunds.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
