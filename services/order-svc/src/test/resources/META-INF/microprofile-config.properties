# Test-only overrides — loaded by @HelidonTest via MicroProfile Config (test classpath takes priority).
# Disable pricing enforcement so OrderIT does not need a live pricing-svc instance.
storeql.order.pricing.enforce=false
# Disable checkout stock holds so OrderIT does not need a live inventory-svc instance.
storeql.order.inventory.reserve-enforce=false
# Consul and Kafka are disabled per-test in static initialiser; repeat here as a safety net.
storeql.consul.enabled=false
storeql.kafka.enabled=false
