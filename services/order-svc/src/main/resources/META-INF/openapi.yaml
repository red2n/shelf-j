openapi: 3.1.0
info:
  title: Order Service API
  version: "1.0"
  description: >
    The transaction/sales-journal service for both channels (docs/ARCHITECTURE.md §10, order-svc):
    online orders/returns and POS parked sales, layaway, gift cards, special orders, and receipts.
    Online checkout and in-store POS share the same endpoints — only channel/fulfilmentType differ
    — so inventory, payments, and reporting behave identically across channels. Coordinates the
    checkout saga with pricing-svc, inventory-svc, and payment-svc, and publishes order/layaway
    lifecycle events via the transactional outbox.
tags:
  - name: Orders
    description: Order lifecycle — place, confirm, cancel, fulfil, void (POS), and returns.
  - name: Layaways
    description: Layaway creation, deposits, completion, and cancellation (POS feature).
  - name: Gift Cards
    description: Gift card issuance, reload, redemption, and transaction history.
  - name: Special Orders
    description: Customer orders placed at a store for future delivery, without immediate stock deduction.
  - name: POS Operations
    description: Parked (suspended) sales and no-sale / open-drawer logging for the POS register.
  - name: POS Transaction Log
    description: Append-only POSLog / e-journal of completed POS transactions.
  - name: POS Stock Positions
    description: Read-only local projection of live on-hand quantities for POS screens.
  - name: Receipts
    description: Receipt / e-journal generation records for orders (print and email).
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:storeql:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:storeql:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
