# order-svc — defaults (local dev).
shelfj.service.name=order-svc
server.port=8007
server.host=0.0.0.0

shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=shelfj
shelfj.db.password=shelfj_dev_change_me
shelfj.db.schema=order

shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

# Gap #63 — server-side pricing. When true, placeOrder resolves every line's unit price
# from pricing-svc and ignores the client-supplied unitPrice. Off by default for local dev
# (no seeded price catalogue); production MUST set this to true.
shelfj.order.pricing.enforce=false

shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
shelfj.outbox.poll-seconds=5

# Gap #50 — SIM→POS sync: inventory event topics consumed by order-svc
shelfj.kafka.topics.stock-received=shelfj.inventory.stock-received
shelfj.kafka.topics.stock-deducted=shelfj.inventory.stock-deducted
shelfj.kafka.topics.stock-adjusted=shelfj.inventory.stock-adjusted

# OpenTelemetry
otel.sdk.disabled=false
otel.service.name=order-svc
otel.traces.exporter=zipkin
otel.exporter.zipkin.endpoint=http://localhost:9411/api/v2/spans
