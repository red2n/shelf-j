# order-svc — defaults (local dev).
shelfj.service.name=order-svc
server.port=8007
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/order-svc/... instead of failing.
mp.openapi.servers=/api/order-svc

shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=order_svc
shelfj.db.password=order_dev_change_me
shelfj.db.schema=order

shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

# Gap #63 — server-side pricing. When true (the secure default), placeOrder resolves every
# line's unit price from pricing-svc and ignores the client-supplied unitPrice.
# Override to false in docker-compose for local dev rigs without a seeded price catalogue.
shelfj.order.pricing.enforce=true

shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
shelfj.outbox.poll-seconds=5

# Gap #50 — SIM→POS sync: inventory event topics consumed by order-svc
shelfj.kafka.topics.stock-received=shelfj.inventory.stock-received
shelfj.kafka.topics.stock-deducted=shelfj.inventory.stock-deducted
shelfj.kafka.topics.stock-adjusted=shelfj.inventory.stock-adjusted

# PaymentRefunded → accumulate refunded_amount + flip order to (PARTIALLY_)REFUNDED
shelfj.kafka.topics.payment-refunded=shelfj.payment.payment-refunded

# Stranded-order sweeper: cancel PENDING orders never paid within ttl-hours (releases their hold).
shelfj.order.pending-sweeper.enabled=true
shelfj.order.pending-sweeper.interval-seconds=300
shelfj.order.pending-sweeper.ttl-hours=24

# OpenTelemetry
otel.sdk.disabled=false
otel.service.name=order-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
