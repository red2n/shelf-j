# sample-svc — default (local-dev) configuration.
# Real deployments override these via environment variables / the central config service.
# NO SECRETS belong in a committed file in production (golden rule #5).

# Service identity
shelfj.service.name=sample-svc

# Helidon MP server
server.port=8000
server.host=0.0.0.0

# Database (plain JDBC for the Phase-0 template)
shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=shelfj
shelfj.db.password=shelfj_dev_change_me

# Consul service discovery
shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

# Kafka / outbox — disabled; sample-svc has no outbox
shelfj.kafka.enabled=false

# Health endpoints are served by MP Health at /health, /health/live, /health/ready, /health/started

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=sample-svc
otel.traces.exporter=zipkin
otel.exporter.zipkin.endpoint=http://localhost:9411/api/v2/spans
