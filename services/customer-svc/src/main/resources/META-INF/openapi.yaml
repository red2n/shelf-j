openapi: 3.1.0
info:
  title: Customer Service API
  version: "1.0"
  description: >
    Customer profiles, addresses, and two append-only ledgers for Shelf-J. Owns customer
    registration/update and GDPR-style anonymize-on-delete, customer addresses, loyalty points
    (earn/redeem/adjust with an auditable ledger), and store credit (issue/redeem with an auditable
    ledger). Publishes CustomerRegistered, LoyaltyEarned/Redeemed/Adjusted, and
    StoreCreditIssued/Redeemed; consumes OrderConfirmed to auto-accrue loyalty points. Reached
    through the API gateway at /api/customer-svc.
tags:
  - name: Customers
    description: Customer profile registration, lookup, update, and GDPR anonymize-on-delete.
  - name: Addresses
    description: Customer address book (CRUD).
  - name: Loyalty
    description: Loyalty points balance, earn/redeem/adjust, and the auditable ledger.
  - name: Store Credit
    description: Store credit balance, issue/redeem.
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:shelfj:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:shelfj:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
