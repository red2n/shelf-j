openapi: 3.1.0
info:
  title: Tenant Service API
  version: "1.0"
  description: >
    Owns the Tenant → Store → Zone hierarchy and tenant onboarding for Shelf-J. Handles self-serve
    business signup (tenant + first store + default zone in one call), ongoing tenant/store/zone/staff
    administration, per-tenant inventory-control parameters, platform-wide tenant oversight, and the
    public storefront config every guest shop reads. Every other service references store/zone data via
    API or events, never a direct DB join — tenant-svc is the source of truth. Reached through the API
    gateway at /api/tenant-svc.
tags:
  - name: Onboarding
    description: Self-serve tenant signup, first-store creation, and onboarding-status checklist.
  - name: Admin
    description: Tenant-scoped administration of the tenant profile, stores, zones, and staff assignments.
  - name: Inventory Config
    description: Per-tenant inventory-control parameters (lot/serial/grade tracking, costing, UOM).
  - name: Platform
    description: Cross-tenant platform-admin operations — listing and suspending/reactivating tenants.
  - name: Storefront
    description: Public, read-only storefront config and store lookup for the guest online shop.
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:shelfj:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:shelfj:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
