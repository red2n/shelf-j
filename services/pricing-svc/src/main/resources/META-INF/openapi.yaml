openapi: 3.1.0
info:
  title: Pricing Service API
  version: "1.0"
  description: >
    Price resolution, promotions, and UK-style VAT computation/reporting for StoreQL
    (docs/ARCHITECTURE.md §10, pricing-svc). Resolves the effective price and VAT breakdown for a
    variant/channel/quantity (used by order-svc's checkout), manages price lists and POS price
    overrides, time-bounded PERCENT/FLAT promotions, HMRC VAT rates and product/customer VAT
    status, and computes the HMRC MTD VAT return (boxes 1-9, per VAT Notice 700 s.17).
tags:
  - name: Price Resolution
    description: Resolve the effective price + VAT breakdown for a variant, channel, and quantity.
  - name: Price Lists
    description: Price list management — create lists and populate per-variant prices.
  - name: Price Overrides
    description: Append-only audit log of staff-approved ad-hoc POS price changes.
  - name: Promotions
    description: Time-bounded promotional discounts (PERCENT or FLAT), scoped to ALL / variant / category.
  - name: VAT Rates
    description: HMRC UK VAT rate management (T1/T5/T0/TX per VAT Notice 700).
  - name: Product VAT Categories
    description: Assign HMRC VAT codes to product variants.
  - name: Customer VAT Status
    description: B2B customer VAT registration status (VAT number, reverse-charge eligibility).
  - name: Tax Transactions
    description: POSLog-compatible tax transaction journal per HMRC VAT Notice 700.
  - name: VAT Return
    description: HMRC Making Tax Digital VAT return computation (boxes 1-9).
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:storeql:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:storeql:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
