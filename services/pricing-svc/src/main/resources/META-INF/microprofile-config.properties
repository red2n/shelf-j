# pricing-svc — defaults (local dev).
shelfj.service.name=pricing-svc
server.port=8005
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/pricing-svc/... instead of failing.
mp.openapi.servers=/api/pricing-svc

shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=pricing_svc
shelfj.db.password=pricing_dev_change_me
shelfj.db.schema=pricing

shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
shelfj.outbox.poll-seconds=5

# OpenTelemetry
otel.sdk.disabled=false
otel.service.name=pricing-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317

# SJ-D39: input VAT for the return arrives from purchase-svc
shelfj.kafka.topics.supplier-invoice-captured=shelfj.purchase.supplier-invoice-captured

# 18.5 Making Tax Digital for VAT. SIMULATED files with an in-process HMRC; HMRC files with the
# real API and needs the application's credentials from HMRC's developer hub plus a key to hold the
# taxpayer's tokens under. All three are secrets: set them in the environment, never here.
# shelfj.mtd.hmrc.base-url=https://test-api.service.hmrc.gov.uk
# shelfj.mtd.hmrc.client-id=
# shelfj.mtd.hmrc.client-secret=
# shelfj.mtd.token-key=            (128/192/256-bit AES key, base64)
shelfj.mtd.vendor.product-name=Shelf-J
