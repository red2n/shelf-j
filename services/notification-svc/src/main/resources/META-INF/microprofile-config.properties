# notification-svc — defaults (local dev).
shelfj.service.name=notification-svc
server.port=8011
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/notification-svc/... instead of failing.
mp.openapi.servers=/api/notification-svc

shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=notification_svc
shelfj.db.password=notification_dev_change_me
shelfj.db.schema=notification

shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092

otel.sdk.disabled=false
otel.service.name=notification-svc
otel.traces.exporter=zipkin
otel.exporter.zipkin.endpoint=http://localhost:9411/api/v2/spans
