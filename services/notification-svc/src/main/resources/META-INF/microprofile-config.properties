# notification-svc — defaults (local dev).
shelfj.service.name=notification-svc
server.port=8011
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/notification-svc/... instead of failing.
mp.openapi.servers=/api/notification-svc

shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=notification_svc
shelfj.db.password=notification_dev_change_me
shelfj.db.schema=notification

shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
# Welcome + order-confirmation notification consumers.
shelfj.kafka.topics.user-registered=shelfj.iam.user-registered
shelfj.kafka.topics.order-confirmed=shelfj.order.order-confirmed

# Outbound notifications (N1). channel=app (default: in-app, persisted to notification_log and
# surfaced in the app), email (SMTP), or mqtt (device-facing push to POS/kiosk/platform console —
# see MqttChannel). SMS is a future channel. SMTP/MQTT host/credentials come from the environment /
# secret store, never committed.
shelfj.notification.channel=app
shelfj.notification.from=no-reply@shelf-j.local
shelfj.notification.smtp.host=localhost
shelfj.notification.smtp.port=587
# smtp.username / smtp.password are unset here — supply them via env/secret store when channel=email.
shelfj.notification.smtp.starttls=true

# MQTT device-push (channel=mqtt): topic shelfj/notifications/{tenantId}/{recipient}, recipient is
# the caller-chosen topic key (e.g. a store id for shortage alerts). The broker knows this
# service's publisher connection by its own password (20.15, see infra/emqx.conf) — it holds no key
# that can sign a platform token.
shelfj.notification.mqtt.host=localhost
shelfj.notification.mqtt.port=1883
shelfj.notification.mqtt.client-id=notification-svc
shelfj.notification.mqtt.tls=false

# shelfj.notification.mqtt.publisher-password is intentionally NOT set here — it comes from the
# environment/secret store and matches the broker's bootstrap file. Only read when channel=mqtt.

otel.sdk.disabled=false
otel.service.name=notification-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0
