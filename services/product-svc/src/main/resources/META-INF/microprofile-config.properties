# product-svc — defaults (local dev).
shelfj.service.name=product-svc
server.port=8003
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/product-svc/... instead of failing.
mp.openapi.servers=/api/product-svc

shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=product_svc
shelfj.db.password=product_dev_change_me
shelfj.db.schema=product

shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
shelfj.outbox.poll-seconds=5

# Redis — backs the findProduct cache-aside read (see ProductRepository).
# shelfj.redis.password is intentionally left at the docker-compose dev default here; override
# via environment in any deployment that changes REDIS_PASSWORD.
shelfj.redis.host=localhost
shelfj.redis.port=6379
shelfj.redis.password=redis_dev_change_me

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=product-svc
otel.traces.exporter=zipkin
otel.exporter.zipkin.endpoint=http://localhost:9411/api/v2/spans
