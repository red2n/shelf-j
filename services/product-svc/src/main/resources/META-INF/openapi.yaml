openapi: 3.1.0
info:
  title: Product Service API
  version: "1.0"
  description: >
    Product/variant master data (PIM) and public storefront catalog browsing for StoreQL. Owns
    brands, categories, products, variants, images, per-store assortment, units of measure, item
    templates/revisions/cross-references/relationships, catalog groups, container types, item
    attribute groups, and category sets. Publishes ProductCreated/ProductUpdated/ProductDelisted,
    VariantCreated, ItemTemplateCreated, and ItemRevisionCreated. Reached through the API gateway at
    /api/product-svc.
tags:
  - name: Catalog
    description: Public storefront catalog browsing/search and POS barcode-scan lookup.
  - name: Brands
    description: Admin brand CRUD.
  - name: Categories
    description: Admin category CRUD (single-hierarchy tree).
  - name: Products
    description: Admin product CRUD and admin product listing.
  - name: Product Images
    description: Upload, fetch, and remove a product's primary image.
  - name: Store Assortment
    description: Which stores a product is sold at (empty = sold everywhere).
  - name: Variants
    description: Admin variant CRUD under a product, plus batch variant resolution.
  - name: Units of Measure
    description: UOM classes/units, quantity conversion, and variant-specific conversion factors.
  - name: Item Templates
    description: Reusable attribute templates and applying them to a variant.
  - name: Cross-References
    description: Supplier/customer part-number cross-references for a variant.
  - name: Item Relationships
    description: Related-item links between variants (substitute, complementary).
  - name: Item Revisions
    description: Dated revisions of a variant's spec.
  - name: Bulk Import
    description: Bulk JSON import and supplier-CSV import of categories/products/variants.
  - name: Catalog Groups
    description: Merchandising catalog-group CRUD, membership, and variant assignment.
  - name: Container Types
    description: Packaging/container type CRUD and variant-to-container links.
  - name: Attribute Groups
    description: Structured attribute-group definitions/fields and a variant's attribute values.
  - name: Category Sets
    description: Alternate category-hierarchy ("category set") CRUD, membership, and variant assignment.
  - name: Merchandising
    description: >
      Shelf space: the shelving a layout is drawn for, planograms version by version, a line's facing
      width, a category's promised share of a store measured against the layouts in force, and the
      resets that put a category on the shelf all at once.
  - name: Assortment
    description: >
      Range: store clusters to decide against, dated and reasoned range changes with the sweep that
      puts them into force on the day, and the range review whose figures stay beside its decisions.
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:storeql:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:storeql:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
