payment-svc — defaults (local dev).
shelfj.service.name=payment-svc
server.port=8009
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/payment-svc/... instead of failing.
mp.openapi.servers=/api/payment-svc

shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=payment_svc
shelfj.db.password=payment_dev_change_me
shelfj.db.schema=payment

shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
shelfj.outbox.poll-seconds=5
# Order events that trigger an automatic refund of the captured payment.
shelfj.kafka.topics.order-returned=shelfj.order.order-returned
shelfj.kafka.topics.order-cancelled=shelfj.order.order-cancelled

# OpenTelemetry
otel.sdk.disabled=false
otel.service.name=payment-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
