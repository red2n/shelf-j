openapi: 3.1.0
info:
  title: Payment Service API
  version: "1.0"
  description: >
    Payment capture, refunds, and store cash management for StoreQL. Records payment tenders
    (CASH/CARD/UPI/WALLET/GIFT_CARD/VOUCHER/STORE_CREDIT) for both POS and online orders, processes
    refunds against captured tenders, and tracks till sessions, cash drops, pay-ins/pay-outs, and
    end-of-day X/Z reports. Publishes PaymentCaptured, PaymentFailed, and PaymentRefunded. Reached
    through the API gateway at /api/payment-svc.
tags:
  - name: Payments
    description: Payment tender capture (staff and online), lookups, and refunds.
  - name: Till Sessions
    description: Cashier till float lifecycle — open, cash drops, X-report, Z-report close.
  - name: Cash Movements
    description: Pay-in/pay-out petty cash movements and daily Z-report generation.
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:storeql:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:storeql:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
