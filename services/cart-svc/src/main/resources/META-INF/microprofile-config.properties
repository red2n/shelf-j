# cart-svc — defaults (local dev).
shelfj.service.name=cart-svc
server.port=8006
server.host=0.0.0.0

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/cart-svc/... instead of failing.
mp.openapi.servers=/api/cart-svc

shelfj.db.url=jdbc:postgresql://localhost:5432/shelfj
shelfj.db.user=cart_svc
shelfj.db.password=cart_dev_change_me
shelfj.db.schema=cart

shelfj.consul.enabled=true
shelfj.consul.host=localhost
shelfj.consul.port=8500

shelfj.kafka.enabled=true
shelfj.kafka.bootstrap=localhost:9092
shelfj.outbox.poll-seconds=5

shelfj.kafka.topics.order-placed=shelfj.order.order-placed
shelfj.kafka.topics.tenant-status-changed=shelfj.tenant.tenant-status-changed
shelfj.kafka.topics.store-status-changed=shelfj.tenant.store-status-changed

# Redis — backs the cart/cart-items cache-aside reads (see CartRepository).
# shelfj.redis.password is intentionally left at the docker-compose dev default here; override
# via environment in any deployment that changes REDIS_PASSWORD.
shelfj.redis.host=localhost
shelfj.redis.port=6379
shelfj.redis.password=redis_dev_change_me

# OpenTelemetry
otel.sdk.disabled=false
otel.service.name=cart-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
