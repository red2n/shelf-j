server.port=8009
mp.application.name=purchase-svc

# OpenAPI: relative server URL resolves against wherever the spec was fetched from (the
# gateway), so Swagger UI's "Try it out" hits /api/purchase-svc/... instead of failing.
mp.openapi.servers=/api/purchase-svc
shelfj.db.schema=purchase
shelfj.db.user=purchase_svc
shelfj.db.password=purchase_dev_change_me
shelfj.consul.enabled=true
shelfj.kafka.enabled=true

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=purchase-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
