openapi: 3.1.0
info:
  title: Purchase Service API
  version: "1.0"
  description: >
    Procurement for Shelf-J: suppliers, purchase orders, goods receipts, and finance-adjacent
    intercompany invoicing. Implements an FRS 102 / UK GAAP-style double-entry nominal ledger and
    BACS-standard intercompany AR/AP invoicing for inter-org stock transfers. Publishes GoodsReceived
    (consumed by inventory-svc and reporting-svc). Reached through the API gateway at
    /api/purchase-svc.
tags:
  - name: Suppliers
    description: Supplier master data.
  - name: Purchase Orders
    description: Purchase order creation, lines, and submission to supplier.
  - name: Goods Receipts
    description: Recording of goods received against a submitted purchase order.
  - name: Intercompany Invoices
    description: Intercompany AR/AP invoicing and settlement for inter-org inventory transfers.
  - name: Nominal Ledger
    description: Read-only double-entry nominal ledger view.
components:
  schemas:
    Problem:
      type: object
      description: >-
        An error as RFC 9457 problem details (application/problem+json). type is a URN for the
        stable code (urn:shelfj:problem:CODE), title the code in words, status the HTTP status,
        detail the message for a person, instance the request path. code and details are the
        platform's extension members, requestId the correlation id, and error/meta the envelope
        members clients read before problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "urn:shelfj:problem:VALIDATION_FAILED" }
        title: { type: string, example: "Validation failed" }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, example: "/api/order-svc/orders" }
        code: { type: string, example: "VALIDATION_FAILED" }
        details: { type: array, items: { type: string } }
        requestId: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
        meta:
          type: object
          properties:
            requestId: { type: string }
            nextCursor: { type: string }
  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
