# Shelf-J structured logging — all JUL output in a parseable bracketed format, useful for
# local/`docker compose logs` reading. Shipping to Loki is via OTLP, not log-scraping: the
# OtelLoggingBridge (shared/common-web) adds a second java.util.logging.Handler at startup
# that forwards every record through the OpenTelemetry Logs API to the otel-collector —
# one shipping path, trace-correlated, no Promtail in between.
#
# Format: [LEVEL] TIMESTAMP [source class method] message\nexception
#   [WARNING] 2026-06-09T19:55:46.123Z [com.shelfj.inventory.GoodsReceivedHandler handle] Failed to handle...
#
# Level: INFO by default. Raise or lower WITHOUT rebuilding via SHELFJ_LOG_LEVEL (or
# -Dshelfj.log.level), which LogLevelConfigurer applies to com.shelfj at startup; JUL reads this
# file once and does not interpolate, so a level written here is otherwise fixed in the image.
# Accepts JUL names (SEVERE/WARNING/INFO/CONFIG/FINE/FINER/FINEST/ALL/OFF) and the usual aliases
# (ERROR/WARN/DEBUG/TRACE).
#
# The handler stays at ALL on purpose: in JUL a handler below the logger level silently drops
# records, so pinning it here is what lets SHELFJ_LOG_LEVEL=FINE actually produce FINE output.

handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=[%4$s] %1$tFT%1$tT.%1$tLZ [%2$s] %5$s%6$s%n

# ── Per-package noise reduction (Helidon/CDI internals are very chatty at FINE) ─
io.helidon.level=INFO
io.helidon.webserver.level=INFO
io.helidon.microprofile.level=INFO
io.helidon.messaging.level=INFO
io.grpc.level=WARNING
org.jboss.weld.level=WARNING
org.glassfish.jersey.level=INFO
org.glassfish.hk2.level=WARNING
com.zaxxer.hikari.level=INFO
org.flywaydb.level=INFO
org.apache.kafka.level=WARNING
io.confluent.level=WARNING

# ── Application code — the default LogLevelConfigurer overrides from the environment ────
com.shelfj.level=INFO
