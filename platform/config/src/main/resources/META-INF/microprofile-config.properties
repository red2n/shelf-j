# config-svc — defaults
shelfj.service.name=config-svc
server.port=8888
server.host=0.0.0.0

# Where to read served configuration from (a directory of <service>-<profile>.properties files).
# Falls back to bundled classpath samples under config-repo/ when the dir is absent.
shelfj.config.repo=config-repo

# Shared internal auth token — must match SHELFJ_CONFIG_TOKEN in the environment.
# The service refuses to start if this is absent or shorter than 32 characters.
# Generate one with: openssl rand -base64 48
shelfj.config.token=${SHELFJ_CONFIG_TOKEN}
