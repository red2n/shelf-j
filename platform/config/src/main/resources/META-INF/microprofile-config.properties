# config-svc — defaults
storeql.service.name=config-svc
server.port=8888
server.host=0.0.0.0

# Where to read served configuration from (a directory of <service>-<profile>.properties files).
# Falls back to bundled classpath samples under config-repo/ when the dir is absent.
storeql.config.repo=config-repo

# Shared internal auth token — must match STOREQL_CONFIG_TOKEN in the environment.
# The service refuses to start if this is absent or shorter than 32 characters.
# Generate one with: openssl rand -base64 48
storeql.config.token=${STOREQL_CONFIG_TOKEN}

# OpenTelemetry — OTLP/gRPC to the collector (override endpoint in docker-compose for containerised stack)
otel.sdk.disabled=false
otel.service.name=config-svc
otel.traces.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
# The API description is OpenAPI 3.1 (the static file says so too; SmallRye emits the version set here).
mp.openapi.extensions.smallrye.openapi=3.1.0
