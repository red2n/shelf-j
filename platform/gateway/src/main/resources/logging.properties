# Shelf-J structured logging — all JUL output in a parseable bracketed format.
# Loki ingestion: each line starts with [LEVEL] so Promtail multiline detection
# and regex extraction both work reliably.
#
# Format: [LEVEL] TIMESTAMP [source class method] message\nexception
#   [WARNING] 2026-06-09T19:55:46.123Z [com.shelfj.inventory.GoodsReceivedHandler handle] Failed to handle...
#
# Levels captured: ALL (FINEST → SEVERE) — filter noise in Grafana/Loki queries.

handlers=java.util.logging.ConsoleHandler
.level=ALL
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=[%4$s] %1$tFT%1$tT.%1$tLZ [%2$s] %5$s%6$s%n

# ── Per-package noise reduction (Helidon/CDI internals are very chatty at FINE) ─
io.helidon.level=INFO
io.helidon.webserver.level=INFO
io.helidon.microprofile.level=INFO
io.helidon.messaging.level=INFO
io.grpc.level=WARNING
org.jboss.weld.level=WARNING
org.glassfish.jersey.level=INFO
org.glassfish.hk2.level=WARNING
com.zaxxer.hikari.level=INFO
org.flywaydb.level=INFO
org.apache.kafka.level=WARNING
io.confluent.level=WARNING

# ── Application code at ALL — capture every DEBUG/FINE/FINER log ──────────────
com.shelfj.level=ALL
