# OTEL Collector — receives OTLP traces+logs from services.
# Traces → Tempo (primary) + Zipkin (legacy compat).
# Logs   → Loki.
#
# Services should export via OTLP:
#   otel.traces.exporter=otlp
#   otel.logs.exporter=otlp
#   otel.exporter.otlp.endpoint=http://otel-collector:4317

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  resource:
    attributes:
      - key: service.namespace
        value: shelf-j
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans
    format: proto
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true
      instance: true
      level: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/tempo, zipkin]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [loki]
