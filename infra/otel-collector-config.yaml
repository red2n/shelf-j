# OTEL Collector — receives OTLP traces from services and exports to Zipkin.
#
# Current services send traces directly to Zipkin via the Zipkin exporter.
# This collector is ready for when services are migrated to standard OTLP:
#   otel.traces.exporter=otlp
#   otel.exporter.otlp.endpoint=http://otel-collector:4317
# (also swap opentelemetry-exporter-zipkin → opentelemetry-exporter-otlp in POMs)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans
    format: proto
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [zipkin]
