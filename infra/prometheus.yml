# Shelf-J — Prometheus scrape configuration.
# All Helidon MP services expose /metrics in Prometheus text format.
# Prometheus itself is on shelfj_network and resolves services by compose service name.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'shelf-j'
    env: 'local'

scrape_configs:

  # ── Platform services ───────────────────────────────────────────────────────
  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']
        labels: { service: 'gateway', layer: 'platform' }

  - job_name: 'config'
    metrics_path: /metrics
    static_configs:
      - targets: ['config:8080']
        labels: { service: 'config', layer: 'platform' }

  # ── Business services ───────────────────────────────────────────────────────
  - job_name: 'iam-svc'
    metrics_path: /metrics
    static_configs:
      - targets: ['iam-svc:8080']
        labels: { service: 'iam-svc', layer: 'business' }

  - job_name: 'tenant-svc'
    metrics_path: /metrics
    static_configs:
      - targets: ['tenant-svc:8080']
        labels: { service: 'tenant-svc', layer: 'business' }

  - job_name: 'inventory-svc'
    metrics_path: /metrics
    static_configs:
      - targets: ['inventory-svc:8080']
        labels: { service: 'inventory-svc', layer: 'business' }

  - job_name: 'product-svc'
    metrics_path: /metrics
    static_configs:
      - targets: ['product-svc:8080']
        labels: { service: 'product-svc', layer: 'business' }

  - job_name: 'sample-svc'
    metrics_path: /metrics
    static_configs:
      - targets: ['sample-svc:8080']
        labels: { service: 'sample-svc', layer: 'business' }

  # ── Prometheus self-monitoring ──────────────────────────────────────────────
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']
        labels: { service: 'prometheus', layer: 'infra' }
