# Serves the Shelf-J Flutter web build as a single-page app (production-grade).
# Runs under the non-root nginx-unprivileged image, which listens on 8080.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml font/ttf font/woff font/woff2;

    # Long-cache the immutable, content-hashed Flutter asset bundles.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point or the version manifest, so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Same-origin API proxy. The Flutter bundle's baked SHELFJ_API_BASE can be either
    # a relative "/api" (what CI bakes into the published ghcr.io/red2n/shelf-j-web
    # image, meant for prod behind one reverse-proxy origin) or an absolute
    # "http://host:port/api" (what a local `flutter build web` bakes for dev, see
    # scripts/redeploy.sh). Absolute URLs bypass this container entirely — the
    # browser calls the gateway host:port directly. This block exists so the
    # relative-URL build also works without a rebuild: it forwards same-origin
    # /api/ calls to the gateway over the compose network.
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        # nginx defaults proxy connections to HTTP/1.0; Helidon's server rejects that
        # with 505 HTTP Version Not Supported. Force 1.1 and drop the hop-by-hop
        # Connection header so keepalive to the upstream works too.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Container-internal health probe.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
