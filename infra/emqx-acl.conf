%% EMQX file-based ACL for the notification-svc device-push channel.
%% "${username}" is the connecting username, which infra/emqx.conf's JWT authenticator has already
%% verified equals the client's own JWT `tenant` claim — it cannot be spoofed.

%% notification-svc's own publisher connection (username "__publisher__"): may write any tenant's
%% topic.
{allow, {user, "__publisher__"}, publish, ["shelfj/notifications/#"]}.

%% Every other client may only subscribe to its own (JWT-verified) tenant's subtree. The `who()`
%% clause has no placeholder substitution (it's a literal/regex match only) — `all` is correct
%% here, with the tenant-scoping done entirely by the `${username}` placeholder in the topic.
{allow, all, subscribe, ["shelfj/notifications/${username}/#"]}.

{deny, all}.
