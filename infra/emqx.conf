# EMQX — local-dev MQTT broker for notification-svc's device-facing push channel.
#
node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

# Auth (20.15): two authenticators, tried in order.
#
# 1. The publisher. notification-svc connects as "__publisher__" with its own password, loaded into
#    EMQX's built-in database from a bootstrap file the deployment provides from its secret store
#    (compose: a config rendered from MQTT_PUBLISHER_PASSWORD; k8s: a Secret mounted as the file).
#    It holds no platform signing key: the password opens this broker and nothing else. A username
#    the database does not know is *ignored* here, so every other client falls through to 2.
#
# 2. Everyone else: a tenant device presents its shelfj platform access token as the MQTT password.
#    iam-svc signs those RS256 with a rotating key and publishes the public half as a JWKS; the
#    broker fetches that key set and verifies against it, so it holds nothing that can mint a
#    token. `verify_claims` ties the connecting username to the token's own `tenant` claim, so a
#    client cannot claim a tenant it holds no token for — the ACL below can then trust ${username}.
#
# EMQX does not interpolate arbitrary env vars into config values; a deployment that serves the key
# set elsewhere overrides the endpoint with EMQX's own convention, EMQX_AUTHENTICATION__2__ENDPOINT
# (EmqxSupport does exactly that in tests).
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
    bootstrap_file = "/opt/emqx/etc/auth-bootstrap.csv"
    bootstrap_type = plain
  },
  {
    mechanism = jwt
    from = password
    use_jwks = true
    endpoint = "http://iam-svc:8080/auth/.well-known/jwks.json"
    # Seconds between reads of the key set. The broker does not re-read on a key id it has not
    # seen, so this is how long a device holding a token signed by a just-rotated key waits before
    # its connect succeeds (it retries), and how long the broker waits for iam-svc on a cold start.
    refresh_interval = 30
    verify_claims {
      tenant = "${username}"
    }
  }
]

# ACL: notification-svc connects as username "__publisher__" (authenticator 1 above) — the one
# identity allowed to write across all tenants. Every other (tenant-scoped) client
# may only read its own tenant's subtree. Rules in infra/emqx-acl.conf.
authorization {
  sources = [
    { type = file, path = "/opt/emqx/etc/acl.conf" }
  ]
  no_match = deny
  deny_action = ignore
}

# HTTP Management API key (port 18083) — iam-svc uses this on logout to kick a user's MQTT
# session (DELETE /api/v5/clients/{clientid}) so a logged-out user stops receiving push
# immediately instead of waiting out the JWT's remaining lifetime. See infra/emqx-api-key.conf
# (dev-only credential, same convention as infra/pgbouncer-userlist.txt — override via a real
# secret store for any non-local environment). That file's bootstrap-file format is a strict
# `key:secret` line per entry with no comment support — EMQX fails to parse it otherwise.
api_key {
  bootstrap_file = "/opt/emqx/etc/api-key.conf"
}

# The dashboard/HTTP Management API server itself (api_key above only provisions a credential for
# it) — EMQX's bundled default emqx.conf enables this on 18083, but this file replaces that
# default wholesale, so it must be declared explicitly or the port is published by Docker/compose
# with nothing actually listening behind it (every request gets a connection reset).
dashboard {
  listeners {
    http {
      bind = 18083
    }
  }
}
