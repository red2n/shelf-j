# EMQX — local-dev MQTT broker for notification-svc's device-facing push channel.
#
node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

# Auth: every client (tenant devices AND notification-svc's own publisher connection) presents a
# shelfj platform JWT (same HS256 secret/issuer as iam-svc, see JwtService) as the MQTT password.
# `verify_claims` ties the connecting username to the JWT's own `tenant` claim, so a client cannot
# claim a tenant it doesn't hold a token for — the ACL rule below can then trust ${username} as the
# caller's real, JWT-verified tenant id.
#
# `secret` below is a placeholder: EMQX does NOT interpolate arbitrary env vars into config values
# (${VAR} in a conf file value only resolves a small set of EMQX-internal path variables like
# ${EMQX_ETC_DIR}, never a custom var — confirmed by connecting with a valid JWT signed with the
# real SHELFJ_JWT_SECRET, which EMQX rejected because it had literally hashed against the string
# "${SHELFJ_JWT_SECRET}"). The real secret must be injected via EMQX's own env-var config-override
# convention instead — every config-registered client (docker-compose, EmqxSupport in tests) sets
# EMQX_AUTHENTICATION__1__SECRET, which overrides authentication.1.secret at container start.
authentication = [
  {
    mechanism = jwt
    use_jwks = false
    algorithm = hmac-based
    secret = "placeholder-overridden-by-EMQX_AUTHENTICATION__1__SECRET-env-var"
    secret_base64_encoded = false
    from = password
    verify_claims {
      tenant = "${username}"
    }
  }
]

# ACL: notification-svc connects as username "__publisher__" with a self-signed token whose
# `tenant` claim is also the literal string "__publisher__" (see PublisherAuth in notification-svc)
# — it's the one identity allowed to write across all tenants. Every other (tenant-scoped) client
# may only read its own tenant's subtree. Rules in infra/emqx-acl.conf.
authorization {
  sources = [
    { type = file, path = "/opt/emqx/etc/acl.conf" }
  ]
  no_match = deny
  deny_action = ignore
}

# HTTP Management API key (port 18083) — iam-svc uses this on logout to kick a user's MQTT
# session (DELETE /api/v5/clients/{clientid}) so a logged-out user stops receiving push
# immediately instead of waiting out the JWT's remaining lifetime. See infra/emqx-api-key.conf
# (dev-only credential, same convention as infra/pgbouncer-userlist.txt — override via a real
# secret store for any non-local environment). That file's bootstrap-file format is a strict
# `key:secret` line per entry with no comment support — EMQX fails to parse it otherwise.
api_key {
  bootstrap_file = "/opt/emqx/etc/api-key.conf"
}

# The dashboard/HTTP Management API server itself (api_key above only provisions a credential for
# it) — EMQX's bundled default emqx.conf enables this on 18083, but this file replaces that
# default wholesale, so it must be declared explicitly or the port is published by Docker/compose
# with nothing actually listening behind it (every request gets a connection reset).
dashboard {
  listeners {
    http {
      bind = 18083
    }
  }
}
