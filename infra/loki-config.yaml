auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Nothing deleted anything before this: chunks accumulated on the loki_data volume for the life of
# the deployment. Retention is enforced by the compactor, which runs in-process here because Loki
# is started as a single binary (no -target flag, so all components run).
#
# delete_request_store is NOT optional once retention_enabled is true — Loki 3.x refuses to start
# without it. It shares the filesystem backend configured under `common.storage`.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  # Grace period between a chunk becoming eligible and actually being removed, so an in-flight
  # query is not reading a file that vanishes underneath it.
  retention_delete_delay: 2h

limits_config:
  reject_old_samples: false
  allow_structured_metadata: false

  # How long logs are kept. Must be at least 24h. Seven days comfortably covers "what happened
  # over the weekend" while bounding the volume, which has no size cap of its own — without this
  # the disk is the only limit and filling it takes Loki down rather than dropping old data.
  retention_period: 168h

  # Ingest throttling. auth_enabled is false, so there is one tenant and these are effectively
  # global. The point is that a single service stuck in an error loop gets rate-limited instead of
  # consuming the whole write path: Loki starts returning 429 to the collector, whose bounded
  # sending_queue and memory_limiter then shed rather than accumulate.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

  # Per-stream limits stop one noisy service (a stream is one label set — roughly one service and
  # level here) from consuming the whole tenant budget and starving the other 13.
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 10MB

  # Stream cardinality. Each stream costs an in-memory chunk in the ingester, so unbounded streams
  # is an OOM against the 512m container limit, not just a disk problem.
  max_global_streams_per_user: 5000

  # Query-side guards, so one careless Grafana query cannot pull the whole retention window into
  # memory and take the container down with it.
  max_entries_limit_per_query: 5000
  max_query_length: 721h
