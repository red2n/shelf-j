apiVersion: v1
kind: Namespace
metadata:
  name: storeql
  # Pod Security Standards: every pod in the namespace must meet the restricted profile — no
  # privileges, no host namespaces or paths, a non-root user, the runtime seccomp profile, every
  # capability dropped. The kubelet refuses a pod that does not; warn and audit say the same.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: storeql-nodes
  # The node exporter alone: it reads the host's /proc and /sys, which the restricted profile
  # forbids, so it lives here under the privileged profile and nothing else does.
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
