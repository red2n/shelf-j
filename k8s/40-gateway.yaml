# Gateway — the only public door (golden rule #2). Terminates behind the Ingress
# (Traefik, bundled with k3s) at api.storeql.com; the Ingress is the TLS/CORS-origin
# edge here, replacing Caddy from the bare-VPS docker-compose.prod.yml setup.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: storeql
spec:
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8080 }]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: storeql
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: gateway
          image: ghcr.io/red2n/storeql-gateway:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: storeql-common-env }
            # No token secret (20.15): the gateway verifies RS256 tokens against the public keys
            # iam-svc publishes at /auth/.well-known/jwks.json and can mint nothing.
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms128m -Xmx512m -XX:+UseG1GC" }
            # Production values (docker-compose.prod.yml overlay) — NOT the dev/k6 defaults
            # from the base docker-compose.yml (30000 req/min, localhost-only CORS origins).
            - { name: STOREQL_GATEWAY_RATE_LIMIT_REQUESTS_PER_MINUTE, value: "100" }
            - { name: STOREQL_GATEWAY_CORS_ALLOWED_ORIGINS, value: "https://app.storeql.com" }
            - { name: STOREQL_GATEWAY_UPSTREAM_READ_TIMEOUT_SECONDS, value: "120" }
            # Trust X-Forwarded-For from the Ingress so the rate-limiter/brute-force
            # throttle key on the real client IP, not the Ingress pod IP.
            - { name: STOREQL_GATEWAY_TRUST_FORWARDED_HEADERS, value: "true" }
            # Where the gateway fetches the web bundle to check its script hashes (same value
            # as docker-compose.yml). Unset = the script integrity monitor stays off.
            - { name: STOREQL_GATEWAY_SCRIPT_INTEGRITY_WEB_URL, value: "http://storeql-app:8080" }
            - name: STOREQL_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: storeql-redis, key: REDIS_PASSWORD } }
          # The 3-endpoint model, as the business services use it. /health is the aggregate of
          # every check a service registers, so a liveness probe pointed at it makes any
          # dependency a reason to kill the pod — a slow database becomes a restart storm.
          # The gateway registers nothing but a process check today; the endpoint it is asked
          # is what keeps that true when somebody adds one. See shared/common-service
          # HealthChecks for the rule.
          startupProbe:
            httpGet: { path: /health/started, port: 8080 }
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 450Mi }
            limits: { cpu: 500m, memory: 700Mi }
