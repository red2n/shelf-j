# shelf-app — the Flutter web bundle (admin console + storefront + POS), served by
# non-root nginx. Its SHELFJ_API_BASE is baked in at CI build time (GitHub Actions
# variable), not runtime-configurable — see k8s/README.md for what that means here.
apiVersion: v1
kind: Service
metadata:
  name: shelf-app
  namespace: shelf-j
spec:
  selector: { app: shelf-app }
  ports: [{ port: 8080, targetPort: 8080 }]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelf-app
  namespace: shelf-j
spec:
  replicas: 1
  selector: { matchLabels: { app: shelf-app } }
  template:
    metadata: { labels: { app: shelf-app } }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: etc-nginx-conf-d, emptyDir: {} }
        - { name: var-cache-nginx, emptyDir: {} }
      containers:
        - name: shelf-app
          image: ghcr.io/red2n/shelf-j-web:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: etc-nginx-conf-d, mountPath: /etc/nginx/conf.d }
            - { name: var-cache-nginx, mountPath: /var/cache/nginx }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
