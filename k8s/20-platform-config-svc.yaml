# config-svc — central non-secret config lookup. Every business service calls it at
# startup and falls back to baked-in defaults if unreachable (see storeql-common-env).
apiVersion: v1
kind: Service
metadata:
  name: config
  namespace: storeql
spec:
  selector: { app: config }
  ports: [{ port: 8080, targetPort: 8080 }]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config
  namespace: storeql
spec:
  replicas: 1
  selector: { matchLabels: { app: config } }
  template:
    metadata: { labels: { app: config } }
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - { name: tmp, emptyDir: {} }
      containers:
        - name: config
          image: ghcr.io/red2n/storeql-config:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: storeql-common-env }
            - secretRef: { name: storeql-config-token } # key "storeql.config.token" — exact-match property name
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms64m -Xmx256m -XX:+UseG1GC" }
          # config-svc's health endpoint is /health (not /health/live like the business
          # services + gateway) — see docker-compose.yml's config service healthcheck.
          # The 3-endpoint model, as the business services use it. /health is the aggregate of
          # every check a service registers, so a liveness probe pointed at it makes any
          # dependency a reason to kill the pod — a slow dependency becomes a restart storm.
          # config-svc registers nothing but a process check today; the endpoint it is asked
          # is what keeps that true when somebody adds one. See shared/common-service
          # HealthChecks for the rule.
          startupProbe:
            httpGet: { path: /health/started, port: 8080 }
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 200Mi }
            limits: { cpu: 300m, memory: 384Mi }
