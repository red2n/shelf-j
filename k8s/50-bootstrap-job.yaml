# One-shot: seeds the PLATFORM_ADMIN on a fresh DB. Safe to re-run — the bootstrap
# endpoint 409s if an admin already exists, treated as success. Mirrors the `bootstrap`
# service in docker-compose.yml; a Job (not a Deployment) is the k8s equivalent of its
# `restart: "no"` one-shot semantics.
#
# Unlike docker-compose's `depends_on: gateway: condition: service_healthy`, a Job has
# no equivalent — it retries against the gateway itself until it responds (up to ~5 min)
# instead of relying on start-order.
apiVersion: batch/v1
kind: Job
metadata:
  name: shelfj-bootstrap
  namespace: shelf-j
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.7.1
          env:
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: shelfj-platform-admin, key: PLATFORM_ADMIN_EMAIL } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: shelfj-platform-admin, key: PLATFORM_ADMIN_PASSWORD } }
          command:
            - sh
            - -c
            - |
              set -e
              for i in $(seq 1 30); do
                if curl -fsS -o /dev/null --max-time 5 http://gateway:8080/health; then break; fi
                echo "[bootstrap] gateway not ready yet, retrying ($i/30)..."; sleep 10
              done
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://gateway:8080/api/iam-svc/bootstrap/admin \
                -H 'Content-Type: application/json' \
                -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
              if [ "$STATUS" = "201" ]; then echo "[bootstrap] Platform admin created ($ADMIN_EMAIL)";
              elif [ "$STATUS" = "409" ]; then echo "[bootstrap] Platform admin already exists — skipped";
              else echo "[bootstrap] Unexpected status $STATUS"; exit 1; fi
