# The 12 business services. Each: own Postgres role/schema, registers with Consul under
# SHELFJ_ADVERTISE_HOST (must equal this file's k8s Service name — the gateway and any
# peer service resolve each other via Consul's stored Address, not k8s DNS directly).
#
# Probes use the full 3-endpoint model (ARCHITECTURE.md DoD): /health/started gates how
# long the JVM + inline Flyway migration get to boot before being killed; /health/ready
# gates traffic (checks real DB/Kafka/config reachability); /health/live triggers a
# restart. docker-compose.yml's single Docker healthcheck only used /health/live for all
# three purposes — Kubernetes lets us use the granular endpoints each service already
# exposes.
#
# Flyway migrations run inline at boot (FlywayRunner, shared/common-service) — there is
# no standalone "migrate-only" entry point in this codebase today, so this mirrors
# exactly how docker-compose.yml and the storeql.com VPS deployment already run in
# production. Safe at replicas: 1 (no concurrent-migration race); re-check before ever
# scaling any of these to >1 replica.

---
apiVersion: v1
kind: Service
metadata: { name: iam-svc, namespace: shelf-j }
spec:
  selector: { app: iam-svc }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: iam-svc, namespace: shelf-j }
spec:
  replicas: 1
  selector: { matchLabels: { app: iam-svc } }
  template:
    metadata: { labels: { app: iam-svc } }
    spec:
      containers:
        - name: iam-svc
          image: ghcr.io/red2n/shelf-j-iam-svc:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: shelfj-common-env }
            - secretRef: { name: shelfj-config-token }
            - secretRef: { name: shelfj-jwt } # key "shelfj.jwt.secret" — iam-svc issues/verifies tokens
          env:
            - { name: SHELFJ_DB_USER, value: "iam_svc" }
            - name: SHELFJ_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shelfj-postgres, key: IAM_DB_PASSWORD } }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms128m -Xmx512m -XX:+UseG1GC" }
            - { name: SHELFJ_ADVERTISE_HOST, value: "iam-svc" }
          startupProbe:
            httpGet: { path: /health/started, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 450Mi }
            limits: { cpu: 500m, memory: 700Mi }

