---
apiVersion: apps/v1
kind: Deployment
metadata: { name: order-svc, namespace: shelf-j }
spec:
  replicas: 1
  selector: { matchLabels: { app: order-svc } }
  template:
    metadata: { labels: { app: order-svc } }
    spec:
      containers:
        - name: order-svc
          image: ghcr.io/red2n/shelf-j-order-svc:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: shelfj-common-env }
            - secretRef: { name: shelfj-config-token }
          env:
            - { name: SHELFJ_DB_USER, value: "order_svc" }
            - name: SHELFJ_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shelfj-postgres, key: ORDER_DB_PASSWORD } }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xms128m -Xmx512m -XX:+UseG1GC" }
            - { name: SHELFJ_ADVERTISE_HOST, value: "order-svc" }
            # docs/vps-deployment.md §5: "Server-side pricing must be true in production."
            - { name: SHELFJ_ORDER_PRICING_ENFORCE, value: "true" }
            # Stock holds for ONLINE checkout. Left false (the dev default) until you've
            # seeded real inventory for your tenants — flip to "true" once you have, or
            # every online checkout will 409 on stock. See docker-compose.yml's comment
            # on shelfj.order.inventory.reserve-enforce.
            - { name: SHELFJ_ORDER_RESERVE_ENFORCE, value: "false" }
          startupProbe:
            httpGet: { path: /health/started, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 450Mi }
            limits: { cpu: 500m, memory: 700Mi }

